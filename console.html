/* ---------- results: loading ----------

   `mode=detail` is the newer Apps Script route. It returns one compact
   record per run (day, sessions, timer, cohort) and one per answer, which
   is what the group and trend views need. If the deployment is older the
   console falls back to `mode=summary`, which still supports everything
   that depends only on item tallies. */

async function loadDetail(cohort) {
  if (!live()) return {
    offline: true
  };
  try {
    const q = cohort ? `&cohort=${encodeURIComponent(cohort)}` : "";
    const r = await fetch(`${ENDPOINT}?mode=detail${q}&t=${Date.now()}`);
    if (!r.ok) return {
      error: `The results endpoint returned ${r.status}.`
    };
    const j = await r.json();
    if (!j || !Array.isArray(j.rows) || !Array.isArray(j.runs)) return {
      legacy: true,
      error: j && j.error ? j.error : null
    };
    return j;
  } catch (e) {
    return {
      error: "Could not reach the results endpoint."
    };
  }
}
